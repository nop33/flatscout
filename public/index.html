<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Flats">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Flats</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">Flats</a>
    <div class="actions">
    <button id="install" class="install" type="button" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 4v11m-4.5-4.5L12 15l4.5-4.5M5 20h14"/></svg>
      Install app
    </button>
    <button id="refresh" class="refresh" type="button" aria-label="Refresh data" title="Refresh data">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
    </button>
    </div>
  </header>
  <main id="app" aria-live="polite"><p class="message">Loading…</p></main>
  <div id="lightbox" class="lightbox" hidden></div>
  <div id="install-help" class="sheet-backdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="install-help-title">
      <h2 id="install-help-title">Add Flats to your Home Screen</h2>
      <ol>
        <li>Tap the <strong>Share</strong> button
          <svg class="share-icon" viewBox="0 0 24 24" width="20" height="20" aria-label="Share icon"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 3v12M8 7l4-4 4 4M6 11H5v10h14V11h-1"/></svg>
          <span class="hint">at the bottom of Safari, or next to the address bar.</span></li>
        <li>Scroll down and tap <strong>Add to Home Screen</strong>.
          <span class="hint">If you don't see it, tap <strong>More</strong> or <strong>Edit Actions</strong> first.</span></li>
        <li>Tap <strong>Add</strong>.</li>
      </ol>
      <button type="button" class="sheet-close">Got it</button>
    </div>
  </div>
  <script src="install.js"></script>
  <script type="module" src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
